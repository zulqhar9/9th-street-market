# "Midnight": true black canvas, iOS-style grey cards, system font, one blue accent.
[theme]
base = "dark"
primaryColor = "#0A84FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
linkColor = "#0A84FF"
linkUnderline = false
blueColor = "#0A84FF"
greenColor = "#30D158"
redColor = "#FF453A"
grayColor = "#8E8E93"
font = "-apple-system, BlinkMacSystemFont, Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseFontSize = 15
headingFontWeights = [700, 650, 600]
headingFontSizes = ["2.75rem", "1.6rem", "1.25rem"]
metricValueFontWeight = 600
metricValueFontSize = "1.9rem"
baseRadius = "large"
buttonRadius = "full"
borderColor = "#2C2C2E"
dataframeBorderColor = "#2C2C2E"
dataframeHeaderBackgroundColor = "#232325"
showSidebarBorder = true
chartCategoricalColors = ["#0A84FF", "#8E8E93", "#30D158", "#FF453A", "#BF5AF2", "#FF9F0A"]

[theme.sidebar]
backgroundColor = "#0A0A0B"
secondaryBackgroundColor = "#1C1C1E"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
